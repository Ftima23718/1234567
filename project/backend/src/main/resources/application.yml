server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: transcampus

  datasource:
    url: jdbc:h2:mem:transcampus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false

jwt:
  secret: bXlTdXBlclNlY3JldEtleUZvclRyYW5zQ2FtcHVzMjAyNVByb2plY3Q=
  expiration: 86400000

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

upload:
  directory: ./uploads